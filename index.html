<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusVoice - MU Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- TOP NAVBAR -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="switchView('landing')">
        <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-sm">MU</div>
        <span class="font-bold text-lg tracking-tight hidden sm:block">Mumbai University <span class="text-indigo-400">CampusVoice</span></span>
        <span class="font-bold text-lg tracking-tight sm:hidden">MU <span class="text-indigo-400">Voice</span></span>
      </div>
      
      <!-- Dynamic Navbar Actions -->
      <div id="navActions" class="hidden">
        <span id="navRoleBadge" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700 mr-3"></span>
        <button onclick="logout()" class="text-sm text-slate-400 hover:text-white transition font-medium border border-slate-700 px-3 py-1 rounded-lg hover:bg-slate-800">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- ========================================== -->
    <!-- VIEW 1: LANDING PAGE (Select Role)         -->
    <!-- ========================================== -->
    <div id="view-landing" class="flex flex-col items-center justify-center min-h-[70vh]">
      <h1 class="text-4xl font-bold text-center mb-4">Welcome to CampusVoice</h1>
      <p class="text-slate-400 text-center mb-10 max-w-lg">The official anonymous issue resolution network for all colleges affiliated with Mumbai University.</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
        <!-- Student Card -->
        <div onclick="switchView('login-student')" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-slate-800/80 transition group shadow-lg">
          <div class="bg-indigo-900/50 w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 group-hover:bg-indigo-600 transition">
            <i data-lucide="graduation-cap" class="w-8 h-8 text-indigo-400 group-hover:text-white"></i>
          </div>
          <h2 class="text-xl font-bold mb-2">Student Login</h2>
          <p class="text-sm text-slate-400">Login with your MU ID to anonymously upvote and raise campus issues.</p>
        </div>

        <!-- Institute Card -->
        <div onclick="switchView('login-institute')" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-emerald-500 hover:bg-slate-800/80 transition group shadow-lg">
          <div class="bg-emerald-900/50 w-16 h-16 mx-auto rounded-full flex items
