<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusVoice — Anonymous Student Feedback</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">CV</div>
        <span class="font-bold text-lg tracking-tight">Campus<span class="text-indigo-400">Voice</span></span>
        <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700 ml-2">Anonymous</span>
      </div>
      <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Raise Issue</span>
      </button>
    </div>
  </header>

  <!-- Main Feed Area -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- Intro Banner -->
    <div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-indigo-900/40 via-purple-900/20 to-slate-800/40 border border-slate-800">
      <h1 class="text-2xl font-bold text-white mb-2">Anonymous Campus Pulse</h1>
      <p class="text-slate-400 text-sm">Upvote practical improvements for our campus. Strictly moderated for constructive feedback — no names or defamatory remarks.</p>
    </div>

    <!-- Category Filters -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterPosts('all')" class="filter-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">All</button>
      <button onclick="filterPosts('Infrastructure')" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Infrastructure</button>
      <button onclick="filterPosts('Canteen')" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Canteen</button>
      <button onclick="filterPosts('Academics')" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Academics</button>
    </div>

    <!-- Feed Container -->
    <div id="postsContainer" class="space-y-4">
      <!-- Dynamic Posts Inject Here -->
    </div>
  </main>

  <!-- Create Issue Modal -->
  <div id="createModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden px-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Raise an Anonymous Issue</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form id="issueForm" onsubmit="handleSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
          <select id="issueCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="Infrastructure">Infrastructure</option>
            <option value="Canteen">Canteen & Food</option>
            <option value="Academics">Academics & Labs</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Issue Title</label>
          <input type="text" id="issueTitle" required placeholder="e.g., Library 3rd Floor Wi-Fi disconnects frequently" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Details & Suggested Fix</label>
          <textarea id="issueDesc" rows="3" required placeholder="Briefly describe what needs fixing..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm rounded-lg text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 text-sm rounded-lg">Submit Anonymously</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Client-Side JavaScript Logic -->
  <script>
    const defaultPosts = [
      {
        id: 1,
        title: "Install UPI barcode scanners at the main canteen food counter",
        desc: "During lunch break at 1 PM, network connectivity inside the canteen fails, causing huge lines at the manual card swipe machine.",
        category: "Canteen",
        votes: 142,
        status: "Acknowledged by Council",
        statusColor: "text-blue-400 bg-blue-900/30 border-blue-800"
      },
      {
        id: 2,
        title: "Extended Library hours during Mid-Sem exam week",
        desc: "Requesting library reading halls to remain open until 8:00 PM instead of closing at 5:30 PM ahead of upcoming unit tests.",
        category: "Academics",
        votes: 89,
        status: "Under Review",
        statusColor: "text-amber-400 bg-amber-900/30 border-amber-800"
      },
      {
        id: 3,
        title: "Computer Lab 4 keyboards need replacement",
        desc: "Several spacebars and Enter keys in row 3 do not register strokes during practical exams.",
        category: "Infrastructure",
        votes: 64,
        status: "Resolved",
        statusColor: "text-emerald-400 bg-emerald-900/30 border-emerald-800"
      }
    ];

    let posts = JSON.parse(localStorage.getItem('campus_posts')) || defaultPosts;
    let userVotes = JSON.parse(localStorage.getItem('user_votes')) || {};
    let currentCategory = 'all';

    function saveState() {
      localStorage.setItem('campus_posts', JSON.stringify(posts));
      localStorage.setItem('user_votes', JSON.stringify(userVotes));
    }

    function renderPosts() {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      const filtered = currentCategory === 'all' 
        ? posts 
        : posts.filter(p => p.category === currentCategory);

      // Sort by votes descending
      filtered.sort((a, b) => b.votes - a.votes);

      filtered.forEach(post => {
        const hasVoted = userVotes[post.id] || false;
        const card = document.createElement('div');
        card.className = "bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 flex items-start gap-4 transition hover:border-slate-600";
        card.innerHTML = `
          <!-- Upvote Column -->
          <div class="flex flex-col items-center">
            <button onclick="handleVote(${post.id})" class="p-2 rounded-lg transition ${hasVoted ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}">
              <i data-lucide="arrow-big-up" class="w-5 h-5"></i>
            </button>
            <span class="text-xs font-bold mt-1.5 ${hasVoted ? 'text-indigo-400' : 'text-slate-300'}">${post.votes}</span>
          </div>

          <!-- Content Column -->
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 border border-slate-600">${post.category}</span>
              <span class="text-xs font-medium px-2 py-0.5 rounded-full border ${post.statusColor}">${post.status}</span>
            </div>
            <h2 class="text-base font-semibold text-white leading-snug mb-1">${post.title}</h2>
            <p class="text-sm text-slate-400 leading-relaxed">${post.desc}</p>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function handleVote(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      if (userVotes[id]) {
        post.votes -= 1;
        delete userVotes[id];
      } else {
        post.votes += 1;
        userVotes[id] = true;
      }
      saveState();
      renderPosts();
    }

    function filterPosts(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700";
      });
      event.target.className = "filter-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white";
      renderPosts();
    }

    function toggleModal(open) {
      document.getElementById('createModal').classList.toggle('hidden', !open);
    }

    function handleSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('issueTitle').value.trim();
      const desc = document.getElementById('issueDesc').value.trim();
      const category = document.getElementById('issueCategory').value;

      if (!title || !desc) return;

      const newPost = {
        id: Date.now(),
        title,
        desc,
        category,
        votes: 1,
        status: "Under Review",
        statusColor: "text-amber-400 bg-amber-900/30 border-amber-800"
      };

      posts.unshift(newPost);
      userVotes[newPost.id] = true;
      saveState();
      renderPosts();
      document.getElementById('issueForm').reset();
      toggleModal(false);
    }

    // Initialize
    renderPosts();
  </script>
</body>
</html>
